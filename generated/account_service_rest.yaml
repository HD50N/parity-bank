openapi: 3.0.3
info:
  title: Account Service API
  description: REST API for account operations
  version: 1.0.0
servers:
  - url: http://localhost:8000
paths:
  /accounts/{account_id}/balance:
    get:
      summary: Get account balance
      operationId: getAccountBalance
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account balance retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalanceResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    AccountBalanceResponse:
      type: object
      properties:
        account_id:
          type: string
        balance:
          type: number
          format: double
        currency:
          type: string
        account_type:
          type: string
        status:
          type: string
        owner_name:
          type: string
        last_transaction_id:
          type: string
        last_transaction_amount:
          type: string
        last_transaction_date:
          type: string
        last_transaction_description:
          type: string
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string